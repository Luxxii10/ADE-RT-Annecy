<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tests — EDT Labo RT</title>
<style>
  :root{ --ink:#101a26; --paper:#f2f4f6; --rule:#c9d1d9; --ok:#1a7f45; --ko:#a32820; --warn:#8a6100; }
  *{box-sizing:border-box}
  body{margin:0;padding:26px 18px 70px;background:var(--paper);color:var(--ink);
    font:400 16px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  main{max-width:56rem;margin:0 auto}
  h1{font-size:1.8rem;margin:0 0 .3rem;font-weight:600;letter-spacing:-.01em}
  .sub{margin:0 0 1.4rem;color:#41566e;max-width:46rem}
  code,.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.85em}
  button{font:inherit;font-size:.95rem;padding:9px 22px;border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);border-radius:3px;cursor:pointer}
  button:disabled{opacity:.45;cursor:progress}
  .bar{padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:20px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  input{font-family:"SF Mono",ui-monospace,monospace;font-size:.85rem;padding:8px 9px;
    border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink);width:12rem}
  label{font-size:.8rem;color:#41566e;display:block;margin-bottom:4px}

  .t{border-bottom:1px solid #dfe4ea;padding:11px 0}
  .t h3{margin:0 0 3px;font-size:.98rem;font-weight:600;display:flex;gap:9px;align-items:baseline}
  .tag{font-family:"SF Mono",ui-monospace,monospace;font-size:.7rem;font-weight:700;
    padding:1px 7px;border-radius:99px;border:1px solid currentColor;flex-shrink:0}
  .ok .tag{color:var(--ok)} .ko .tag{color:var(--ko)} .warn .tag{color:var(--warn)}
  .t p{margin:0;font-size:.9rem;color:#41566e}
  .t pre{margin:6px 0 0;padding:8px 10px;background:#fff;border:1px solid var(--rule);
    border-radius:3px;font-size:.78rem;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
  #verdict{margin:20px 0 0;padding:14px 16px;background:#fff;border-left:3px solid var(--ink);display:none}
  #verdict h2{margin:0 0 .35rem;font-size:1.05rem;font-weight:600}
  #verdict p{margin:0 0 .5rem;font-size:.94rem}
  #verdict ol{margin:.4rem 0 0;padding-left:1.3rem;font-size:.94rem}
</style>
</head>
<body>
<main>
  <h1>Tests du site</h1>
  <p class="sub">À déposer dans le dépôt, à côté de <code>dispo.txt</code>, puis à ouvrir depuis GitHub Pages. Les tests en même origine n'ont de sens que servis depuis le même dossier que les fichiers.</p>

  <div class="bar">
    <div>
      <label for="cible">Fichier du site à inspecter</label>
      <input id="cible" value="m90.html">
    </div>
    <button id="go">Lancer les tests</button>
  </div>

  <div id="out"></div>
  <div id="verdict"></div>
</main>

<script>
const out = document.getElementById('out');
const RAW = 'https://raw.githubusercontent.com/Luxxii10/ADE-RT-Annecy/main/';
let resultats = [];

function ligne(etat, titre, desc, extrait){
  const d = document.createElement('div');
  d.className = 't ' + etat;
  const lbl = etat==='ok' ? 'OK' : etat==='ko' ? 'ÉCHEC' : 'ATTENTION';
  d.innerHTML = `<h3><span class="tag">${lbl}</span> ${titre}</h3><p>${desc}</p>` +
                (extrait ? `<pre>${String(extrait).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])).slice(0,600)}</pre>` : '');
  out.appendChild(d);
  resultats.push({etat, titre});
}

async function lire(url){
  const t0 = Date.now();
  try{
    const r = await fetch(url, {cache:'reload'});
    const txt = await r.text();
    return {ok:r.ok, status:r.status, txt, ms:Date.now()-t0};
  }catch(e){
    return {ok:false, status:0, err:e.message, ms:Date.now()-t0};
  }
}

const estHTML = t => /^\s*<(!doctype|html)/i.test(t||'');

async function testerFichier(nom){
  // ── même origine (chemin relatif, donc même dossier que cette page)
  const rel = await lire(nom + '?t=' + Date.now());
  if(!rel.ok){
    ligne('ko', `${nom} — même origine`,
      rel.status ? `HTTP ${rel.status}. Le fichier n'est pas à côté de cette page.`
                 : `Requête impossible : ${rel.err}`);
  } else if(estHTML(rel.txt)){
    ligne('ko', `${nom} — même origine`,
      `HTTP 200 mais du HTML est renvoyé : c'est une page 404 déguisée, le fichier n'existe pas à cet emplacement.`, rel.txt.slice(0,200));
  } else {
    ligne('ok', `${nom} — même origine`,
      `Lu en ${rel.ms} ms depuis <code>${new URL(nom, location.href).pathname}</code>.`, rel.txt);
  }

  // ── raw.githubusercontent (repli)
  const raw = await lire(RAW + nom + '?t=' + Date.now());
  if(!raw.ok){
    ligne('warn', `${nom} — raw.githubusercontent`,
      raw.status ? `HTTP ${raw.status}.` : `Bloqué ou injoignable : ${raw.err}`);
  } else {
    const memeContenu = rel.ok && !estHTML(rel.txt) && rel.txt.trim() === raw.txt.trim();
    ligne(memeContenu || !rel.ok ? 'ok' : 'warn', `${nom} — raw.githubusercontent`,
      memeContenu ? `Lu en ${raw.ms} ms, contenu identique à la version locale.`
                  : `Lu en ${raw.ms} ms. <strong>Contenu différent de la version locale</strong> : le CDN GitHub est en retard (il garde ~5 min).`,
      raw.txt);
  }
  return rel.ok && !estHTML(rel.txt) ? rel.txt : (raw.ok ? raw.txt : null);
}

document.getElementById('go').addEventListener('click', async () => {
  const btn = document.getElementById('go');
  btn.disabled = true; out.innerHTML=''; resultats=[];
  document.getElementById('verdict').style.display='none';
  const cible = document.getElementById('cible').value.trim() || 'm90.html';

  // 1 ─ contexte
  if(location.protocol === 'file:'){
    ligne('ko','Contexte','Page ouverte en <code>file://</code>. Les tests en même origine ne peuvent pas fonctionner : il faut ouvrir cette page depuis GitHub Pages.');
  } else {
    ligne('ok','Contexte', `Servie depuis <code>${location.origin}${location.pathname}</code>. Les chemins relatifs pointent vers <code>${new URL('.', location.href).pathname}</code>.`);
  }

  // 2 ─ fichiers de pilotage
  const dispo = await testerFichier('dispo.txt');
  await testerFichier('annonce.txt');

  // 3 ─ interprétation de dispo.txt
  if(dispo === null){
    ligne('ko','Valeur de dispo.txt','Aucune source lisible.');
  } else {
    const v = dispo.replace(/^\uFEFF/,'').trim().toUpperCase();
    if(/^ON\b/.test(v))       ligne('ok','Valeur de dispo.txt', 'Interprétée comme <strong>Labo ouvert</strong>.', JSON.stringify(dispo));
    else if(/^OFF\b/.test(v)) ligne('ok','Valeur de dispo.txt', 'Interprétée comme <strong>Labo fermé</strong>.', JSON.stringify(dispo));
    else ligne('ko','Valeur de dispo.txt','Ni ON ni OFF : l\'indicateur se masquera. Le fichier doit contenir uniquement ON ou OFF.', JSON.stringify(dispo));
  }

  // 4 ─ quelle version du site est réellement déployée
  const site = await lire(cible + '?t=' + Date.now());
  if(!site.ok){
    ligne('ko', `Version de ${cible}`, `Introuvable (HTTP ${site.status||'—'}).`);
  } else {
    const h = site.txt;
    const mv    = h.match(/VERSION_SITE\s*=\s*'([^']+)'/);
    const gist  = /api\.github\.com\/gists|GIST_ID/.test(h);
    const ghraw = h.includes('raw.githubusercontent.com/Luxxii10');
    const labo  = h.includes('id="labo-etat"');
    const hid   = h.includes('.labo-etat[hidden]');

    const details =
      `Version déclarée : ${mv ? mv[1] : '(absente — fichier antérieur au marqueur)'}\n` +
      `Lit annonce.txt via le dépôt : ${ghraw ? 'oui' : 'NON'}\n` +
      `Code Gist encore présent     : ${gist ? 'OUI — version obsolète' : 'non'}\n` +
      `Indicateur labo présent      : ${labo ? 'oui' : 'NON'}\n` +
      `Correctif [hidden] présent   : ${hid ? 'oui' : 'NON'}\n` +
      `Taille : ${h.length.toLocaleString('fr-FR')} octets`;

    if(gist || !ghraw)      ligne('ko',   `Version de ${cible}`, 'Version <strong>obsolète</strong> déployée. C\'est la cause des symptômes.', details);
    else if(!hid)           ligne('warn', `Version de ${cible}`, 'Version intermédiaire : lit bien le dépôt, mais le correctif <code>[hidden]</code> manque, donc l\'indicateur ne peut pas se masquer.', details);
    else                    ligne('ok',   `Version de ${cible}`, 'Version à jour.', details);
  }

  // 5 ─ service worker et caches
  try{
    const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
    ligne(regs.length ? 'warn' : 'ok', 'Service worker',
      regs.length ? `${regs.length} enregistrement(s) actif(s). Peut servir une ancienne page. Le supprimer via Application → Service Workers → Unregister.`
                  : 'Aucun enregistrement actif — il ne peut pas être en cause.');
  }catch(e){ ligne('warn','Service worker','Vérification impossible : '+e.message); }

  try{
    const ks = window.caches ? await caches.keys() : [];
    ligne(ks.length ? 'warn' : 'ok', 'Caches du navigateur',
      ks.length ? `Caches présents : ${ks.join(', ')}.` : 'Aucun cache.');
  }catch(e){ ligne('warn','Caches du navigateur','Vérification impossible.'); }

  // ── verdict
  const v = document.getElementById('verdict');
  const kos = resultats.filter(r=>r.etat==='ko');
  const etapes = [];
  if(kos.some(r=>r.titre.startsWith('Version'))) etapes.push('Remplacer le fichier déployé par la dernière version, puis recharger avec Ctrl+Shift+R.');
  if(kos.some(r=>r.titre.includes('même origine'))) etapes.push('Vérifier que <code>dispo.txt</code> et <code>annonce.txt</code> sont dans le même dossier que cette page, sur la branche <code>main</code>.');
  if(kos.some(r=>r.titre.startsWith('Valeur'))) etapes.push('Corriger le contenu de <code>dispo.txt</code> : uniquement <code>ON</code> ou <code>OFF</code>.');
  if(!etapes.length) etapes.push('Rien à corriger ici : si le site se comporte encore mal, le problème est ailleurs.');

  v.style.display='block';
  v.innerHTML = `<h2>${kos.length ? kos.length + ' problème(s) bloquant(s)' : 'Aucun problème bloquant'}</h2>
    <p>À faire :</p><ol>${etapes.map(e=>`<li>${e}</li>`).join('')}</ol>`;
  btn.disabled = false;
});
</script>
</body>
</html>
